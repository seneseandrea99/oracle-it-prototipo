<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex">

<body>
  <div id="map" aria-label="Mappa degli eventi in Italia"></div>
  <div class="scan" aria-hidden="true"></div>
  <svg class="leader" id="leader" aria-hidden="true"><polyline id="leader-line" points=""/><circle id="leader-dot" r="3"/></svg>
  <div class="lock" id="lock" hidden aria-hidden="true">
    <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    <span class="lock-tag" id="lock-tag"></span>
  </div>

  <header class="strip">
    <div class="strip-row">
      <div class="brand"><b>ORACLE<span>IT</span></b><span class="tag">Dati sintetici</span></div>
      <div class="counters" id="counters" aria-live="polite"></div>
    </div>
    <div class="filters" id="filters" role="toolbar" aria-label="Filtri"></div>
  </header>

  <section class="panel" id="panel" data-state="peek" aria-label="Eventi">
    <button class="grip" id="grip" aria-label="Espandi o riduci il pannello"><span></span></button>
    <div class="panel-body" id="panel-body"></div>
  </section>

  <div class="maperr" id="maperr" hidden>La mappa non si è caricata. Controlla la connessione e ricarica la pagina.</div>
</body>
